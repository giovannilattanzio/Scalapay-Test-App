name: catalog_api
description: "Generated Dio client for the Scalapay catalog API."
version: 1.0.0
publish_to: none
resolution: workspace

# HAND-MAINTAINED. Listed in .openapi-generator-ignore so regeneration leaves it
# alone. Versions are pinned to the ones the app uses, not to the generator's
# suggestions (which ask for dio ^5.7.0, copy_with_extension ^7.1.0 and
# json_annotation ^4.9.0), so that the workspace resolves as a whole.

environment:
  sdk: ^3.13.4

dependencies:
  dio: ^5.11.1
  json_annotation: 4.11.0
  # The dart-dio templates annotate every model with @CopyWith as well.
  copy_with_extension: 12.1.0

dev_dependencies:
  build_runner: ^2.15.1
  json_serializable: ^6.13.2
  copy_with_extension_gen: 12.1.0
